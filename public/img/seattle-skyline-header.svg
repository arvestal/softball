<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="140" viewBox="0 0 1100 140">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c2c56"/>
      <stop offset="1" stop-color="#002244"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#69be28" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#005c5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4ced4"/>
      <stop offset="1" stop-color="#69be28"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="140" fill="url(#sky)"/>
  <circle cx="550" cy="58" r="60" fill="url(#glow)"/>

  <text x="550" y="30" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="22" font-weight="700" letter-spacing="10" fill="#e6edf3">SEATTLE</text>

  <!-- distant skyline -->
  <g fill="#04122a">
    <rect x="0" y="98" width="45" height="42"/>
    <rect x="50" y="82" width="30" height="58"/>
    <rect x="85" y="104" width="50" height="36"/>
    <rect x="140" y="90" width="34" height="50"/>
    <rect x="960" y="94" width="40" height="46"/>
    <rect x="1005" y="78" width="28" height="62"/>
    <rect x="1038" y="100" width="44" height="40"/>
    <rect x="1075" y="88" width="25" height="52"/>
  </g>

  <!-- Space Needle -->
  <g stroke="url(#needle)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 520 140 L 550 62 L 580 140"/>
    <path d="M 528 140 L 550 90"/>
    <path d="M 572 140 L 550 90"/>
  </g>
  <ellipse cx="550" cy="60" rx="34" ry="11" fill="url(#needle)"/>
  <line x1="550" y1="49" x2="550" y2="20" stroke="url(#needle)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="550" cy="17" r="3" fill="#69be28"/>

  <!-- near skyline -->
  <g fill="#04122a">
    <rect x="180" y="112" width="38" height="28"/>
    <rect x="222" y="100" width="26" height="40"/>
    <rect x="252" y="118" width="60" height="22"/>
    <rect x="316" y="106" width="32" height="34"/>
    <rect x="352" y="115" width="46" height="25"/>
    <rect x="402" y="108" width="30" height="32"/>
    <rect x="700" y="108" width="34" height="32"/>
    <rect x="738" y="118" width="50" height="22"/>
    <rect x="792" y="102" width="28" height="38"/>
    <rect x="824" y="114" width="40" height="26"/>
    <rect x="868" y="106" width="30" height="34"/>
    <rect x="902" y="116" width="50" height="24"/>
  </g>

  <rect x="0" y="138" width="1100" height="2" fill="#69be28" opacity="0.6"/>
</svg>
